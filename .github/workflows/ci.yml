name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write


concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: development
      DEMO_MODE: 'true'
      ADMIN_PASSWORD: 'CiPassword123!'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: API tests
        run: npm test
      - name: Build server + dashboard
        run: npm run build
      - name: Upload dashboard bundle
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist
          retention-days: 5

  e2e:
    name: browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright
        id: playwright
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log
      - name: Publish browser failure log
        if: steps.playwright.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          { echo "run: $GITHUB_RUN_ID"; echo '```'; tail -n 400 e2e.log; echo '```'; } > log.md
          gh api "repos/$GH_REPO/issues" -f title="ci-e2e-log $GITHUB_RUN_ID" -f body="$(cat log.md)" --jq .number
      - name: Fail when browser tests failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 5
