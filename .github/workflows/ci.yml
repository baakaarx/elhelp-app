name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:



concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: development
      ADMIN_EMAIL: 'ci@elhelp.test'
      ADMIN_PASSWORD: 'CiPassword123!'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: API tests
        run: npm test
      - name: Build server + dashboard
        run: npm run build
      - name: Upload dashboard bundle
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist
          retention-days: 5

  e2e:
    name: browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee playwright.log
      # Build logs are not always reachable from automation; surface the failing test in the
      # check-run annotations so a red run is self-explanatory.
      - name: Explain the failure
        if: failure()
        run: |
          node -e "
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('playwright.log', 'utf8'); } catch {}
            // Browser console chatter can hide the failed locator and source line in annotations.
            const lines = log.split(/\r?\n/).filter(line => !/^\s*\[pid=/.test(line));
            const start = lines.findIndex(line => /^\s*\d+\)/.test(line));
            const excerpt = (start >= 0 ? lines.slice(start, start + 30) : lines.slice(-30)).join(' | ');
            const clean = excerpt.replace(/%/g, '%25').replace(/\r?\n/g, '%0A').slice(0, 4000);
            console.log('::error title=Playwright failure::' + clean);
          "
      - name: Upload Playwright log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-log
          path: playwright.log
          retention-days: 5
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright.log
            playwright-report
          retention-days: 5
