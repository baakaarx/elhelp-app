name: Android APK

# Builds an installable release APK without needing Android Studio on the machine.
# Run it from the Actions tab (enter the API URL), or push a v* tag.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'API base URL the installed app should talk to (https://… or http://IP:3000)'
        required: true
        default: 'https://tracking.example.com'
  push:
    tags: ['v*']

jobs:
  apk:
    name: build apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      API_URL: ${{ inputs.api_url || vars.ELHELP_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install
        run: npm ci

      # Runs the exact script a developer runs locally, so CI proves it still works.
      - name: Build release APK
        run: |
          set -euo pipefail
          if [ -z "${API_URL:-}" ]; then
            echo "::error title=API URL missing::Set the api_url input (or a repository variable ELHELP_API_URL) — the APK bakes this address in at build time."
            exit 1
          fi
          npm run build:apk -- "${API_URL%/}"

      - name: Collect the APK
        run: |
          mkdir -p out
          cp mobile/dist-android/*.apk "out/elhelp-engineer-${GITHUB_REF_NAME//\//-}.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: elhelp-apk
          path: out/*.apk
          retention-days: 30
